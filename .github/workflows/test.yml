name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install Python package
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests -q -m "not (mermaid or integration)"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Pandoc & LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer
      - name: Install Node & Puppeteer Chromium
        run: |
          npm ci || npm install
          npx puppeteer browsers install chrome
      - name: Install Python package
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Persian Mermaid end-to-end render test
        run: python -m pytest tests/test_mermaid.py -k test_real_persian_mermaid_rendering_integration -v -rs
      - name: End-to-end integration and visual tests
        run: python -m pytest tests -v -rs

