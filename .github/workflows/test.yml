name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install Python package
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Tool versions
        run: python -V && pandoc -v | head -n 1
      - name: Unit tests
        run: python -m pytest tests -q -m "not (mermaid or integration)" -k "not test_smoke_wheel_build_and_template_assets"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test wheel assets
        run: pip install -c constraints.txt -e ".[dev]" && python -m pytest tests/test_smoke.py -q -rs

  integration:
    runs-on: ubuntu-latest
    env:
      MD2DOCX_REQUIRE_EXTERNAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Pandoc & LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer
      - name: Install Node from lockfile
        run: npm ci
      - name: Install Puppeteer Chromium
        run: npx puppeteer browsers install chrome
      - name: Install Python package
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Tool versions
        run: python -V && pandoc -v | head -n 1 && node -v
      - name: Required mermaid + visual tests
        run: python -m pytest tests -v -rs
