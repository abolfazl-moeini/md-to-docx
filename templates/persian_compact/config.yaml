schema_version: 1
name: persian_compact
direction: rtl
language_bidi: fa-IR
language_latin: en-US
fonts:
  body: Vazirmatn
  heading: Vazirmatn
  latin: Vazirmatn
  code: Courier New
font_files:
  Vazirmatn: fonts/Vazirmatn-Regular.ttf
  Vazirmatn-Bold: fonts/Vazirmatn-Bold.ttf
shell: shell.docx
page:
  size: A5
  margin_cm:
    top: 1.6
    bottom: 1.6
    left: 1.6
    right: 1.6
  font_size_pt: 11.5
  line_spacing: 1.25
  paragraph_align: start
  space_after_pt: 5.0
caption:
  size_pt: 9.0
custom_styles:
  chapter overview: overview
  dba note: note
  important note: important
  warning: warning
  lab note: lab
  screenshot recommendation: editorial
colors:
  primary: 2E3440
  primary_dark: '242933'
  on_primary: FFFFFF
  quote_bg: ECEFF4
  warning_bg: FBF7F4
  warning_title: 8B6914
  body: 2E3440
  caption: 4C566A
headings:
  extract_number: true
  badge: false
  h1:
    size_pt: 19
    page_break_before: true
  h2:
    size_pt: 16
  h3:
    size_pt: 13.5
  h4:
    size_pt: 12
  h5:
    size_pt: 11.5
  h6:
    size_pt: 11.5
callouts:
  note:
    classes:
    - note
    default_title: نکته
    icon: ◆
    header_bg: primary_dark
    header_fg: on_primary
    body_bg: ECEFF4
  warning:
    classes:
    - warning
    default_title: هشدار
    icon: ''
    header_bg: warning_bg
    header_fg: warning_title
    body_bg: warning_bg
  overview:
    classes:
    - overview
    default_title: ''
    icon: ''
    header_bg: primary_dark
    header_fg: on_primary
    body_bg: ECEFF4
  important:
    classes:
    - important
    default_title: توجه مهم
    icon: '!'
    header_bg: warning_bg
    header_fg: warning_title
    body_bg: F9F9F9
  lab:
    classes:
    - lab
    default_title: یادداشت تمرین
    icon: ◆
    header_bg: primary_dark
    header_fg: on_primary
    body_bg: ECEFF4
  editorial:
    classes:
    - editorial
    default_title: پیشنهاد تصویر
    icon: ◆
    header_bg: ECEFF4
    header_fg: caption
    body_bg: FAFAFA
quotes:
  border_side: physical_right
  border_pt: 8
  border_color: primary
  bg: quote_bg
tables:
  header_bg: primary
  header_fg: on_primary
  bidi_visual: true
code_block:
  theme: friendly
  bg: F8F9FA
  border_color: D8DEE9
  border_sz: 4
  font_size_pt: 9.0
  line_spacing: 1.15
mermaid:
  format: png
  scale: 3
  max_width_in: 4.5
  theme_file: mermaid.json
  css_file: mermaid.css
  puppeteer_config: puppeteer.json
